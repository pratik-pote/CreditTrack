<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Credit Pro</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Inter,Arial,sans-serif;
}

:root{
    --primary:#166534;
    --primary-dark:#14532d;
    --primary-light:#dcfce7;
    --bg:#f3f6f9;
    --card:#ffffff;
    --text:#1f2937;
    --muted:#6b7280;
    --danger:#dc2626;
    --danger-light:#fee2e2;
    --blue:#2563eb;
    --blue-light:#dbeafe;
    --orange:#ea580c;
    --orange-light:#ffedd5;
    --border:#e5e7eb;
}

body{
    background:var(--bg);
    color:var(--text);
    padding-bottom:85px;
    transition:.2s;
}

body.dark{
    --bg:#111827;
    --card:#1f2937;
    --text:#f9fafb;
    --muted:#9ca3af;
    --border:#374151;
}

button{
    border:none;
    cursor:pointer;
}

input,select{
    font-size:15px;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#166534,#15803d);
    color:white;
    padding:22px 18px;
    position:sticky;
    top:0;
    z-index:20;
}

.header-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.header h1{
    font-size:25px;
}

.header p{
    margin-top:5px;
    opacity:.85;
    font-size:13px;
}

.header-badge{
    display:inline-block;
    margin-top:9px;
    padding:5px 9px;
    border-radius:20px;
    background:rgba(255,255,255,.15);
    font-size:11px;
}

.icon-btn{
    background:rgba(255,255,255,.15);
    color:white;
    width:42px;
    height:42px;
    border-radius:12px;
    font-size:19px;
}

/* DASHBOARD */

.dashboard{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    padding:18px;
}

.card{
    background:var(--card);
    padding:18px;
    border-radius:16px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.card-title{
    color:var(--muted);
    font-size:13px;
}

.card-value{
    margin-top:8px;
    font-size:24px;
    font-weight:800;
}

.green{color:#15803d}
.red{color:#dc2626}
.blue{color:#2563eb}
.orange{color:#ea580c}

/* CREDIT SUMMARY */

.summary{
    margin:0 18px 18px;
    background:linear-gradient(
        135deg,
        var(--primary),
        #15803d
    );
    color:white;
    padding:18px;
    border-radius:16px;
    box-shadow:0 4px 15px rgba(22,101,52,.2);
}

.summary-title{
    font-size:13px;
    opacity:.85;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    align-items:end;
    margin-top:7px;
}

.summary-value{
    font-size:26px;
    font-weight:800;
}

.summary-note{
    font-size:12px;
    opacity:.8;
}

/* TOOLBAR */

.toolbar{
    display:flex;
    gap:10px;
    padding:0 18px 18px;
}

.search{
    flex:1;
    padding:13px 15px;
    border:none;
    border-radius:12px;
    outline:none;
    background:var(--card);
    color:var(--text);
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.filter{
    padding:13px;
    border:none;
    border-radius:12px;
    background:var(--card);
    color:var(--text);
}

/* SECTION */

.section{
    padding:0 18px;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:4px 0 12px;
}

.section-header h2{
    font-size:19px;
}

.primary-small{
    background:var(--primary);
    color:white;
    padding:10px 14px;
    border-radius:10px;
    font-weight:bold;
}

/* CUSTOMER */

.customer{
    background:var(--card);
    padding:16px;
    border-radius:16px;
    margin-bottom:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.customer-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.customer-name{
    font-size:17px;
    font-weight:800;
}

.customer-phone{
    color:var(--muted);
    font-size:13px;
    margin-top:4px;
}

.balance{
    font-size:18px;
    font-weight:800;
    color:var(--danger);
    white-space:nowrap;
}

.customer-info{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    margin-top:12px;
    color:var(--muted);
    font-size:12px;
}

.customer-buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-top:14px;
}

.small-btn{
    padding:10px 5px;
    border-radius:9px;
    font-size:12px;
    font-weight:bold;
}

.credit-btn{
    background:var(--danger-light);
    color:#b91c1c;
}

.payment-btn{
    background:var(--primary-light);
    color:#15803d;
}

.history-btn{
    background:var(--blue-light);
    color:#1d4ed8;
}

.edit-btn{
    background:#fef3c7;
    color:#92400e;
}

/* EMPTY */

.empty{
    background:var(--card);
    padding:40px 15px;
    text-align:center;
    color:var(--muted);
    border-radius:15px;
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:68px;
    background:var(--card);
    display:flex;
    justify-content:space-around;
    align-items:center;
    box-shadow:0 -3px 15px rgba(0,0,0,.1);
    z-index:50;
}

.nav-btn{
    background:none;
    color:var(--muted);
    font-size:11px;
}

.nav-btn span{
    display:block;
    font-size:21px;
    margin-bottom:3px;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:100;
    align-items:flex-end;
}

.modal-content{
    background:var(--card);
    color:var(--text);
    width:100%;
    max-height:92vh;
    overflow-y:auto;
    border-radius:22px 22px 0 0;
    padding:22px;
}

.modal-content h2{
    margin-bottom:18px;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    color:var(--muted);
    font-size:13px;
    margin-bottom:6px;
}

.form-group input,
.form-group select{
    width:100%;
    padding:13px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--card);
    color:var(--text);
    outline:none;
}

.primary-btn,
.cancel-btn{
    width:100%;
    padding:14px;
    border-radius:10px;
    font-size:15px;
    font-weight:bold;
}

.primary-btn{
    background:var(--primary);
    color:white;
}

.cancel-btn{
    background:#e5e7eb;
    color:#374151;
    margin-top:8px;
}

/* HISTORY */

.history-header{
    background:var(--primary-light);
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
}

.history-balance{
    font-size:24px;
    font-weight:800;
    color:var(--danger);
    margin-top:5px;
}

.history-item{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:14px 0;
    border-bottom:1px solid var(--border);
}

.history-date{
    color:var(--muted);
    font-size:11px;
    margin-top:4px;
}

.history-credit{
    color:var(--danger);
    font-weight:bold;
}

.history-payment{
    color:#15803d;
    font-weight:bold;
}

/* TOAST */

.toast{
    display:none;
    position:fixed;
    left:50%;
    bottom:85px;
    transform:translateX(-50%);
    background:#111827;
    color:white;
    padding:12px 20px;
    border-radius:10px;
    z-index:300;
    font-size:14px;
    white-space:nowrap;
}

/* RESPONSIVE */

@media(max-width:700px){

    .dashboard{
        grid-template-columns:1fr 1fr;
        padding:14px;
    }

    .summary{
        margin:0 14px 14px;
    }

    .toolbar{
        padding:0 14px 14px;
    }

    .section{
        padding:0 14px;
    }

    .customer-buttons{
        grid-template-columns:1fr 1fr;
    }

    .card-value{
        font-size:20px;
    }

    .header h1{
        font-size:22px;
    }
}

@media(max-width:420px){

    .toolbar{
        flex-direction:column;
    }

    .filter{
        width:100%;
    }

}
</style>
</head>

<body>

<!-- HEADER -->

<header class="header">

    <div class="header-row">

        <div>

            <h1>🏪 Smart Credit Pro</h1>

            <p>
                Simple & powerful credit management
            </p>

            <span class="header-badge">
                BUSINESS CREDIT MANAGER
            </span>

        </div>

        <button
            class="icon-btn"
            onclick="toggleDarkMode()"
            id="themeButton"
        >
            🌙
        </button>

    </div>

</header>


<!-- DASHBOARD -->

<section class="dashboard">

    <div class="card">

        <div class="card-title">
            Customers
        </div>

        <div
            class="card-value blue"
            id="customerCount"
        >
            0
        </div>

    </div>


    <div class="card">

        <div class="card-title">
            Total Credit
        </div>

        <div
            class="card-value red"
            id="totalCredit"
        >
            ₹0
        </div>

    </div>


    <div class="card">

        <div class="card-title">
            Received
        </div>

        <div
            class="card-value green"
            id="totalPayment"
        >
            ₹0
        </div>

    </div>


    <div class="card">

        <div class="card-title">
            Outstanding
        </div>

        <div
            class="card-value orange"
            id="totalOutstanding"
        >
            ₹0
        </div>

    </div>

</section>


<!-- CREDIT SUMMARY -->

<section class="summary">

    <div class="summary-title">
        CURRENT OUTSTANDING CREDIT
    </div>

    <div class="summary-row">

        <div>

            <div
                class="summary-value"
                id="summaryOutstanding"
            >
                ₹0
            </div>

            <div class="summary-note">
                Total amount customers currently owe
            </div>

        </div>

        <div style="font-size:35px;">
            💳
        </div>

    </div>

</section>


<!-- SEARCH -->

<div class="toolbar">

    <input
        class="search"
        id="searchInput"
        placeholder="🔍 Search customer..."
        oninput="renderCustomers()"
    >

    <select
        class="filter"
        id="filterSelect"
        onchange="renderCustomers()"
    >

        <option value="all">
            All Customers
        </option>

        <option value="highest">
            Highest Credit
        </option>

        <option value="lowest">
            Lowest Credit
        </option>

        <option value="overdue">
            Overdue
        </option>

    </select>

</div>


<!-- CUSTOMERS -->

<section class="section">

    <div class="section-header">

        <h2>
            Customer Credit
        </h2>

        <button
            class="primary-small"
            onclick="openCustomerModal()"
        >
            + Add Customer
        </button>

    </div>

    <div id="customerList"></div>

</section>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

    <button
        class="nav-btn"
        onclick="scrollTopPage()"
    >
        <span>🏠</span>
        Home
    </button>


    <button
        class="nav-btn"
        onclick="openCustomerModal()"
    >
        <span>👤</span>
        Customer
    </button>


    <button
        class="nav-btn"
        onclick="openCreditModal()"
    >
        <span>💳</span>
        Credit
    </button>


    <button
        class="nav-btn"
        onclick="openPaymentModal()"
    >
        <span>💰</span>
        Payment
    </button>


    <button
        class="nav-btn"
        onclick="exportData()"
    >
        <span>📤</span>
        Export
    </button>

</nav>


<!-- CUSTOMER MODAL -->

<div
    class="modal"
    id="customerModal"
>

<div class="modal-content">

<h2 id="customerModalTitle">
    👤 Add Customer
</h2>

<div class="form-group">

<label>
    Customer Name
</label>

<input
    id="customerName"
    type="text"
    placeholder="Enter customer name"
>

</div>


<div class="form-group">

<label>
    Phone Number
</label>

<input
    id="customerPhone"
    type="tel"
    placeholder="Enter phone number"
>

</div>


<button
    class="primary-btn"
    onclick="saveCustomer()"
>
    Save Customer
</button>


<button
    class="cancel-btn"
    onclick="closeModal('customerModal')"
>
    Cancel
</button>

</div>
</div>


<!-- CREDIT MODAL -->

<div
    class="modal"
    id="creditModal"
>

<div class="modal-content">

<h2>
    💳 Add Credit
</h2>


<div class="form-group">

<label>
    Customer
</label>

<select id="creditCustomer"></select>

</div>


<div class="form-group">

<label>
    Credit Amount ₹
</label>

<input
    id="creditAmount"
    type="number"
    min="1"
    placeholder="Enter credit amount"
>

</div>


<div class="form-group">

<label>
    Description / Items
</label>

<input
    id="creditDescription"
    type="text"
    placeholder="e.g. Rice, Sugar, Oil"
>

</div>


<div class="form-group">

<label>
    Due Date
</label>

<input
    id="creditDueDate"
    type="date"
>

</div>


<button
    class="primary-btn"
    onclick="addCredit()"
>
    Save Credit
</button>


<button
    class="cancel-btn"
    onclick="closeModal('creditModal')"
>
    Cancel
</button>

</div>
</div>


<!-- PAYMENT MODAL -->

<div
    class="modal"
    id="paymentModal"
>

<div class="modal-content">

<h2>
    💰 Receive Payment
</h2>


<div class="form-group">

<label>
    Customer
</label>

<select id="paymentCustomer"></select>

</div>


<div class="form-group">

<label>
    Payment Amount ₹
</label>

<input
    id="paymentAmount"
    type="number"
    min="1"
    placeholder="Enter payment amount"
>

</div>


<button
    class="primary-btn"
    onclick="receivePayment()"
>
    Save Payment
</button>


<button
    class="cancel-btn"
    onclick="closeModal('paymentModal')"
>
    Cancel
</button>

</div>
</div>


<!-- HISTORY -->

<div
    class="modal"
    id="historyModal"
>

<div class="modal-content">

<h2 id="historyTitle">
    📒 Credit Ledger
</h2>

<div id="historyContent"></div>

<button
    class="cancel-btn"
    onclick="closeModal('historyModal')"
>
    Close
</button>

</div>
</div>


<!-- TOAST -->

<div
    class="toast"
    id="toast"
></div>


<script>

/* =========================================================
   DATABASE
========================================================= */

let customers =
    JSON.parse(
        localStorage.getItem(
            "smartCreditCustomers"
        )
    ) || [];


let transactions =
    JSON.parse(
        localStorage.getItem(
            "smartCreditTransactions"
        )
    ) || [];


let editingCustomerId = null;


/* =========================================================
   SAVE DATABASE
========================================================= */

function saveData(){

    localStorage.setItem(
        "smartCreditCustomers",
        JSON.stringify(customers)
    );

    localStorage.setItem(
        "smartCreditTransactions",
        JSON.stringify(transactions)
    );
}


/* =========================================================
   IDS
========================================================= */

function nextCustomerId(){

    if(customers.length === 0)
        return 1;

    return Math.max(
        ...customers.map(c => c.id)
    ) + 1;
}


function nextTransactionId(){

    if(transactions.length === 0)
        return 1;

    return Math.max(
        ...transactions.map(t => t.id)
    ) + 1;
}


/* =========================================================
   CUSTOMER
========================================================= */

function saveCustomer(){

    const name =
        document.getElementById(
            "customerName"
        ).value.trim();


    const phone =
        document.getElementById(
            "customerPhone"
        ).value.trim();


    if(!name){

        showToast(
            "Enter customer name"
        );

        return;
    }


    const duplicate =
        customers.find(c =>
            c.phone &&
            phone &&
            c.phone === phone &&
            c.id !== editingCustomerId
        );


    if(duplicate){

        showToast(
            "Phone number already exists"
        );

        return;
    }


    if(editingCustomerId){

        const customer =
            customers.find(
                c =>
                c.id === editingCustomerId
            );


        if(customer){

            customer.name = name;
            customer.phone = phone;

        }


        showToast(
            "Customer updated"
        );

    }else{

        customers.push({

            id:
                nextCustomerId(),

            name:
                name,

            phone:
                phone,

            createdAt:
                new Date().toISOString()

        });


        showToast(
            "Customer added successfully"
        );

    }


    saveData();


    document.getElementById(
        "customerName"
    ).value = "";


    document.getElementById(
        "customerPhone"
    ).value = "";


    editingCustomerId = null;


    closeModal(
        "customerModal"
    );


    renderAll();
}


function editCustomer(id){

    const customer =
        customers.find(
            c => c.id === id
        );


    if(!customer)
        return;


    editingCustomerId = id;


    document.getElementById(
        "customerModalTitle"
    ).textContent =
        "✏️ Edit Customer";


    document.getElementById(
        "customerName"
    ).value =
        customer.name;


    document.getElementById(
        "customerPhone"
    ).value =
        customer.phone || "";


    document.getElementById(
        "customerModal"
    ).style.display =
        "flex";
}


function openCustomerModal(){

    editingCustomerId = null;


    document.getElementById(
        "customerModalTitle"
    ).textContent =
        "👤 Add Customer";


    document.getElementById(
        "customerName"
    ).value = "";


    document.getElementById(
        "customerPhone"
    ).value = "";


    document.getElementById(
        "customerModal"
    ).style.display =
        "flex";
}


/* =========================================================
   BALANCE
========================================================= */

function getBalance(customerId){

    let balance = 0;


    transactions.forEach(t => {

        if(
            t.customerId !==
            customerId
        )
            return;


        if(
            t.type ===
            "credit"
        )
            balance +=
                Number(t.amount);


        if(
            t.type ===
            "payment"
        )
            balance -=
                Number(t.amount);

    });


    return balance;
}


/* =========================================================
   ADD CREDIT
========================================================= */

function addCredit(){

    const customerId =
        Number(
            document.getElementById(
                "creditCustomer"
            ).value
        );


    const amount =
        Number(
            document.getElementById(
                "creditAmount"
            ).value
        );


    const description =
        document.getElementById(
            "creditDescription"
        ).value.trim();


    const dueDate =
        document.getElementById(
            "creditDueDate"
        ).value;


    if(!customerId){

        showToast(
            "Select customer"
        );

        return;
    }


    if(
        !amount ||
        amount <= 0
    ){

        showToast(
            "Enter valid credit amount"
        );

        return;
    }


    transactions.push({

        id:
            nextTransactionId(),

        customerId:
            customerId,

        type:
            "credit",

        amount:
            amount,

        description:
            description ||
            "Credit purchase",

        dueDate:
            dueDate ||
            null,

        date:
            new Date().toISOString()

    });


    saveData();


    document.getElementById(
        "creditAmount"
    ).value = "";


    document.getElementById(
        "creditDescription"
    ).value = "";


    document.getElementById(
        "creditDueDate"
    ).value = "";


    closeModal(
        "creditModal"
    );


    renderAll();


    showToast(
        "Credit added successfully"
    );
}


/* =========================================================
   PAYMENT
========================================================= */

function receivePayment(){

    const customerId =
        Number(
            document.getElementById(
                "paymentCustomer"
            ).value
        );


    const amount =
        Number(
            document.getElementById(
                "paymentAmount"
            ).value
        );


    if(!customerId){

        showToast(
            "Select customer"
        );

        return;
    }


    if(
        !amount ||
        amount <= 0
    ){

        showToast(
            "Enter valid payment"
        );

        return;
    }


    const balance =
        getBalance(
            customerId
        );


    if(balance <= 0){

        showToast(
            "No outstanding credit"
        );

        return;
    }


    if(amount > balance){

        showToast(
            "Payment cannot exceed outstanding credit"
        );

        return;
    }


    transactions.push({

        id:
            nextTransactionId(),

        customerId:
            customerId,

        type:
            "payment",

        amount:
            amount,

        description:
            "Payment received",

        date:
            new Date().toISOString()

    });


    saveData();


    document.getElementById(
        "paymentAmount"
    ).value = "";


    closeModal(
        "paymentModal"
    );


    renderAll();


    showToast(
        "Payment recorded successfully"
    );
}


/* =========================================================
   CUSTOMER LIST
========================================================= */

function renderCustomers(){

    const list =
        document.getElementById(
            "customerList"
        );


    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .toLowerCase()
        .trim();


    const filter =
        document.getElementById(
            "filterSelect"
        ).value;


    let filtered =
        customers.filter(c => {

            return (

                c.name
                    .toLowerCase()
                    .includes(search)

                ||

                (c.phone || "")
                    .toLowerCase()
                    .includes(search)

            );

        });


    if(
        filter ===
        "highest"
    ){

        filtered.sort(
            (a,b) =>
                getBalance(b.id)
                -
                getBalance(a.id)
        );

    }


    if(
        filter ===
        "lowest"
    ){

        filtered.sort(
            (a,b) =>
                getBalance(a.id)
                -
                getBalance(b.id)
        );

    }


    if(
        filter ===
        "overdue"
    ){

        filtered =
            filtered.filter(
                c =>
                    hasOverdue(
                        c.id
                    )
            );

    }


    if(
        filtered.length ===
        0
    ){

        list.innerHTML = `

            <div class="empty">

                <div
                    style="font-size:35px;"
                >
                    👥
                </div>

                <br>

                No customers found.

                <br><br>

                Add your first customer
                to start managing credit.

            </div>

        `;

        return;
    }


    list.innerHTML =
        filtered.map(
            customer => {

                const balance =
                    getBalance(
                        customer.id
                    );


                const totalCredit =
                    getCustomerCredit(
                        customer.id
                    );


                const totalPayment =
                    getCustomerPayment(
                        customer.id
                    );


                const overdue =
                    hasOverdue(
                        customer.id
                    );


                return `

                <div
                    class="customer"
                >

                    <div
                        class="customer-top"
                    >

                        <div>

                            <div
                                class="customer-name"
                            >
                                ${escapeHtml(
                                    customer.name
                                )}
                            </div>

                            <div
                                class="customer-phone"
                            >
                                ${escapeHtml(
                                    customer.phone ||
                                    "No phone number"
                                )}
                            </div>

                        </div>


                        <div
                            class="balance"
                        >
                            ₹${formatMoney(
                                balance
                            )}
                        </div>

                    </div>


                    <div
                        class="customer-info"
                    >

                        <span>
                            Credit ₹${formatMoney(
                                totalCredit
                            )}
                        </span>


                        <span>
                            Paid ₹${formatMoney(
                                totalPayment
                            )}
                        </span>


                        ${
                            overdue
                            ?
                            `
                            <span
                                style="
                                color:#ea580c;
                                font-weight:bold;
                                "
                            >
                                ⚠️ Overdue
                            </span>
                            `
                            :
                            ""
                        }

                    </div>


                    <div
                        class="customer-buttons"
                    >

                        <button
                            class="
                            small-btn
                            credit-btn
                            "
                            onclick="
                            openCreditFor(
                                ${customer.id}
                            )
                            "
                        >
                            + Credit
                        </button>


                        <button
                            class="
                            small-btn
                            payment-btn
                            "
                            onclick="
                            openPaymentFor(
                                ${customer.id}
                            )
                            "
                        >
                            ₹ Payment
                        </button>


                        <button
                            class="
                            small-btn
                            history-btn
                            "
                            onclick="
                            showHistory(
                                ${customer.id}
                            )
                            "
                        >
                            📒 Ledger
                        </button>


                        <button
                            class="
                            small-btn
                            edit-btn
                            "
                            onclick="
                            editCustomer(
                                ${customer.id}
                            )
                            "
                        >
                            ✏️ Edit
                        </button>

                    </div>

                </div>

                `;

            }
        ).join("");
}


/* =========================================================
   CUSTOMER STATISTICS
========================================================= */

function getCustomerCredit(id){

    return transactions

        .filter(
            t =>
                t.customerId === id &&
                t.type === "credit"
        )

        .reduce(
            (sum,t) =>
                sum +
                Number(t.amount),
            0
        );
}


function getCustomerPayment(id){

    return transactions

        .filter(
            t =>
                t.customerId === id &&
                t.type === "payment"
        )

        .reduce(
            (sum,t) =>
                sum +
                Number(t.amount),
            0
        );
}


/* =========================================================
   OVERDUE
========================================================= */

function hasOverdue(
    customerId
){

    const today =
        new Date();


    today.setHours(
        0,0,0,0
    );


    return transactions.some(
        t => {

            if(
                t.customerId !==
                customerId ||

                t.type !==
                "credit" ||

                !t.dueDate
            )
                return false;


            const due =
                new Date(
                    t.dueDate
                );


            due.setHours(
                0,0,0,0
            );


            return (

                due < today &&

                getBalance(
                    customerId
                ) > 0

            );

        }
    );
}


/* =========================================================
   DASHBOARD
========================================================= */

function updateDashboard(){

    let credit = 0;

    let payment = 0;


    transactions.forEach(t => {

        if(
            t.type ===
            "credit"
        ){

            credit +=
                Number(
                    t.amount
                );

        }


        if(
            t.type ===
            "payment"
        ){

            payment +=
                Number(
                    t.amount
                );

        }

    });


    const outstanding =
        Math.max(
            0,
            credit - payment
        );


    document.getElementById(
        "customerCount"
    ).textContent =
        customers.length;


    document.getElementById(
        "totalCredit"
    ).textContent =
        "₹" +
        formatMoney(
            credit
        );


    document.getElementById(
        "totalPayment"
    ).textContent =
        "₹" +
        formatMoney(
            payment
        );


    document.getElementById(
        "totalOutstanding"
    ).textContent =
        "₹" +
        formatMoney(
            outstanding
        );


    document.getElementById(
        "summaryOutstanding"
    ).textContent =
        "₹" +
        formatMoney(
            outstanding
        );
}


/* =========================================================
   DROPDOWNS
========================================================= */

            <option

            >

                    " - " +
                    escapeHtml(

                    )
                    :

                }

    ).innerHTML =

    document.getElementById(
        "paymentCustomer"
    ).innerHTML =

        `<option value="">
            Select customer
        </option>`

        +

        options;
}

/* =========================================================
   HISTORY / CREDIT LEDGER
========================================================= */

function showHistory(
    customerId
){

    const customer =
        customers.find(
            c =>
                c.id ===
                customerId
        );


    if(!customer)
        return;


    const balance =
        getBalance(
            customerId
        );


    const customerTransactions =
        transactions

        .filter(
            t =>
                t.customerId ===
                customerId
        )

        .sort(
            (a,b) =>
                new Date(b.date)
                -
                new Date(a.date)
        );


    document.getElementById(
        "historyTitle"
    ).textContent =
        "📒 " +
        customer.name +
        " - Credit Ledger";


    const container =
        document.getElementById(
            "historyContent"
        );


    let html = `

        <div
            class="history-header"
        >

            <div>
                Outstanding Credit
            </div>


            <div
                class="history-balance"
            >
                ₹${formatMoney(
                    balance
                )}
            </div>


            <div
                style="
                margin-top:8px;
                color:#6b7280;
                font-size:13px;
                "
            >
                ${escapeHtml(
                    customer.phone ||
                    ""
                )}
            </div>

        </div>

    `;


    if(
        customerTransactions.length
        === 0
    ){

        html += `

            <div
                class="empty"
            >
                No transactions yet.
            </div>

        `;

    }else{

        html +=

            customerTransactions
            .map(
                t => {

                    const isCredit =
                        t.type ===
                        "credit";


                    const date =
                        new Date(
                            t.date
                        )
                        .toLocaleString(
                            "en-IN"
                        );


                    return `

                    <div
                        class="history-item"
                    >

                        <div>

                            <strong>
                                ${
                                    isCredit
                                    ?
                                    "Credit"
                                    :
                                    "Payment"
                                }
                            </strong>


                            <div
                                style="
                                font-size:13px;
                                margin-top:4px;
                                "
                            >
                                ${escapeHtml(
                                    t.description ||
                                    ""
                                )}
                            </div>


                            <div
                                class="history-date"
                            >
                                ${date}
                            </div>


                            ${
                                t.dueDate
                                ?
                                `
                                <div
                                    class="history-date"
                                >
                                    Due:
                                    ${formatDate(
                                        t.dueDate
                                    )}
                                </div>
                                `
                                :
                                ""
                            }

                        </div>


                        <div
                            class="${
                                isCredit
                                ?
                                "history-credit"
                                :
                                "history-payment"
                            }"
                        >

                            ${
                                isCredit
                                ?
                                "+"
                                :
                                "-"
                            }

                            ₹${formatMoney(
                                t.amount
                            )}

                        </div>

                    </div>

                    `;

                }
            ).join("");

    }


    container.innerHTML =
        html;


    document.getElementById(
        "historyModal"
    ).style.display =
        "flex";
}


/* =========================================================
   EXPORT
========================================================= */

function exportData(){

    const data = {

        app:
            "Smart Credit Pro",

        exportedAt:
            new Date()
            .toISOString(),

        customers:
            customers,

        transactions:
            transactions

    };


    const blob =
        new Blob(
            [
                JSON.stringify(
                    data,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;


    a.download =
        "smart-credit-backup.json";


    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);


    URL.revokeObjectURL(
        url
    );


    showToast(
        "Credit backup downloaded"
    );
}


/* =========================================================
   DARK MODE
========================================================= */

function toggleDarkMode(){

    document.body.classList.toggle(
        "dark"
    );


    const dark =
        document.body.classList.contains(
            "dark"
        );


    localStorage.setItem(
        "smartCreditDark",
        dark
    );


    document.getElementById(
        "themeButton"
    ).textContent =
        dark
        ?
        "☀️"
        :
        "🌙";
}


function loadTheme(){

    const dark =
        localStorage.getItem(
            "smartCreditDark"
        ) ===
        "true";


    if(dark){

        document.body.classList.add(
            "dark"
        );


        document.getElementById(
            "themeButton"
        ).textContent =
            "☀️";

    }
}

========================================================= */

function closeModal(id){

    document.getElementById(
        id
    ).style.display =
        "none";
}


document
.querySelectorAll(".modal")

    modal => {

        modal.addEventListener(
            "click",
            function(e){

                if(

                    modal
                ){

                    modal.style.display =

                }

            }
        );

    }

/* =========================================================
   HELPERS
========================================================= */

function formatMoney(
    number
){

    return Number(
        number
    )
    .toLocaleString(
        "en-IN",
        {
            minimumFractionDigits:
                0,

            maximumFractionDigits:
                2
        }
    );
}


function formatDate(
    date
){

    return new Date(
        date
    )
    .toLocaleDateString(
        "en-IN"
    );
}


function escapeHtml(
    text
){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(
            text ??
            ""
        );


    return div.innerHTML;
}


function showToast(
    message
){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.style.display =
        "block";


    setTimeout(
        () => {

            toast.style.display =
                "none";

        },
        2500
    );
}


function scrollTopPage(){

    window.scrollTo({

        top:0,

        behavior:"smooth"

    });
}


/* =========================================================
   INITIALIZE
========================================================= */

function renderAll(){

    updateDashboard();

    updateDropdowns();

    renderCustomers();

}


loadTheme();

renderAll();

</script>
